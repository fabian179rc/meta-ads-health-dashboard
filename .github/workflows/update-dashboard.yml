name: Update dashboard

on:
  # re-touched to force GitHub to (re-)index this workflow
  schedule:
    - cron: "0 11 * * *"  # 08:00 ART (UTC-3) daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_and_analyze.py
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "chore: update dashboard data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
